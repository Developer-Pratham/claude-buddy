<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="claude-buddy: a tiny animated block critter for the Claude Code prompt">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1a1226"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9a62"/>
      <stop offset="1" stop-color="#ff5f8f"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="20" fill="url(#grid)"/>

  <!-- terminal window -->
  <g transform="translate(300 40)">
    <rect width="600" height="340" rx="14" fill="#0b0f14" stroke="#2a3140" stroke-width="2"/>
    <path d="M0 14a14 14 0 0 1 14-14h572a14 14 0 0 1 14 14v30H0z" fill="#161b24"/>
    <circle cx="26" cy="22" r="6" fill="#ff5f57"/>
    <circle cx="48" cy="22" r="6" fill="#febc2e"/>
    <circle cx="70" cy="22" r="6" fill="#28c840"/>
    <text x="300" y="27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#6b7686">claude code</text>

    <!-- title -->
    <text x="300" y="120" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="56" font-weight="700" fill="url(#accent)">claude-buddy</text>
    <text x="300" y="158" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#9aa5b4">a tiny animated block critter above your prompt</text>

    <!-- buttons -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" text-anchor="middle">
      <rect x="70" y="200" width="100" height="38" rx="8" fill="#1b2230" stroke="#323c50"/>
      <text x="120" y="225" fill="#e6edf3">pet</text>
      <rect x="190" y="200" width="100" height="38" rx="8" fill="#1b2230" stroke="#323c50"/>
      <text x="240" y="225" fill="#e6edf3">wave</text>
      <rect x="310" y="200" width="100" height="38" rx="8" fill="#1b2230" stroke="#323c50"/>
      <text x="360" y="225" fill="#e6edf3">dance</text>
      <rect x="430" y="200" width="100" height="38" rx="8" fill="#1b2230" stroke="#323c50"/>
      <text x="480" y="225" fill="#e6edf3">sleep</text>
    </g>

    <!-- prompt line -->
    <rect x="30" y="268" width="540" height="46" rx="8" fill="#10151d" stroke="#2a3140"/>
    <text x="48" y="297" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#ff9a62">&gt;</text>
    <text x="72" y="297" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#6b7686">your prompt lives here</text>
    <rect x="292" y="284" width="9" height="18" fill="#ff9a62">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
